name: pulso-transmi-model-drift

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      force_retrain:
        description: "Reentrenar aunque no se supere el umbral de drift"
        required: false
        default: false
        type: boolean

concurrency:
  # All workflows write to the same Supabase project. A shared queue avoids
  # concurrent ingestion/training jobs exhausting the database connection budget.
  group: pulso-transmi-supabase-writer
  cancel-in-progress: false

jobs:
  drift-and-retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate required secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PULSO_API_URL: ${{ secrets.PULSO_API_URL }}
          PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
        run: |
          missing=0
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY PULSO_API_URL PULSO_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub Secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Configure the missing secrets in repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Required secrets are configured."
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install '.[ml]'
      - name: Ingest latest observations
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PULSO_API_URL: ${{ secrets.PULSO_API_URL }}
          PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
          GITHUB_SHA: ${{ github.sha }}
        run: python -u -m src.ingest
      - name: Evaluate model drift
        id: drift
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRIFT_PSI_THRESHOLD: ${{ vars.DRIFT_PSI_THRESHOLD || '0.20' }}
          DRIFTED_FEATURES_REQUIRED: ${{ vars.DRIFTED_FEATURES_REQUIRED || '2' }}
          DRIFT_PERFORMANCE_RATIO: ${{ vars.DRIFT_PERFORMANCE_RATIO || '1.25' }}
          DRIFT_MIN_ROWS: ${{ vars.DRIFT_MIN_ROWS || '96' }}
          RETRAIN_COOLDOWN_HOURS: ${{ vars.RETRAIN_COOLDOWN_HOURS || '24' }}
        run: python -u -m src.drift
      - name: Retrain and publish after drift
        if: steps.drift.outputs.retrain == 'true' || inputs.force_retrain == true
        env:
          PULSO_API_URL: ${{ secrets.PULSO_API_URL }}
          PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_SHA: ${{ github.sha }}
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_USERNAME: ${{ secrets.MLFLOW_USERNAME }}
          MLFLOW_PASSWORD: ${{ secrets.MLFLOW_PASSWORD }}
          DAGSHUB_REPO_OWNER: ${{ vars.DAGSHUB_REPO_OWNER }}
          DAGSHUB_REPO_NAME: ${{ vars.DAGSHUB_REPO_NAME }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          MLFLOW_EXPERIMENT_NAME: ${{ vars.MLFLOW_EXPERIMENT_NAME || 'pulso-transmi' }}
          MLFLOW_REGISTERED_MODEL_NAME: ${{ vars.MLFLOW_REGISTERED_MODEL_NAME || 'pulso-transmi-demand' }}
          MLFLOW_ENVIRONMENT: production
        run: python -u -m src.pipeline
      - name: Publish current model predictions
        if: steps.drift.outputs.retrain != 'true' && inputs.force_retrain != true
        env:
          PULSO_API_URL: ${{ secrets.PULSO_API_URL }}
          PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set +e
          last_status=1
          for attempt in 1 2 3; do
            echo "Intento de publicación $attempt/3"
            python -u -m src.pipeline --publish-only
            last_status=$?
            if [ "$last_status" -eq 0 ]; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((60 * attempt))
              echo "Publicación no disponible; reintentando en ${delay}s"
              sleep "$delay"
            fi
          done
          exit "$last_status"
      - name: Upload failed pipeline diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: model-drift-diagnostics-${{ github.run_id }}
          path: |
            artifacts/outbox/
            artifacts/pipeline-status.json
            artifacts/baseline/metrics.json
            artifacts/baseline/predictions.csv
          if-no-files-found: ignore
