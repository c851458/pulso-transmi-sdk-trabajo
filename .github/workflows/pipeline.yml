name: pulso-transmi-pipeline

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions interpreta este horario en UTC.
    - cron: "*/5 * * * *"

concurrency:
  group: pulso-transmi-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PULSO_API_URL: ${{ secrets.PULSO_API_URL }}
          PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
        run: |
          missing=0
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY PULSO_API_URL PULSO_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub Secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Configure the missing secrets in repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Required secrets are configured."

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install '.[dev,ml]'

      - name: Run tests
        run: python -m pytest -q

      - name: Extract and update source data
        env:
          PULSO_API_URL: ${{ secrets.PULSO_API_URL }}
          PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_SHA: ${{ github.sha }}
        run: python -u -m src.ingest

      - name: Run inference and publish metrics
        env:
          PULSO_API_URL: ${{ secrets.PULSO_API_URL }}
          PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_SHA: ${{ github.sha }}
        run: python -u -m src.pipeline

      - name: Upload pending payloads on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-diagnostics-${{ github.run_id }}
          path: |
            artifacts/outbox/
            artifacts/pipeline-status.json
            artifacts/baseline/predictions.csv
          if-no-files-found: ignore
