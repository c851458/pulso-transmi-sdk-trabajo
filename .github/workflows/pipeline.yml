name: pulso-transmi-pipeline

on:
  # cron-job.org dispara este workflow cada 10 minutos vía workflow_dispatch.
  # No se agrega schedule aquí para evitar ejecuciones duplicadas.
  # El modelo solo se reentrena cuando su accuracy reciente baja de
  # RETRAIN_ACCURACY_THRESHOLD (79 % por defecto), con al menos RETRAIN_INTERVAL_HOURS
  # (1 h) entre reentrenamientos; en las demás ejecuciones se publica con el modelo activo.
  workflow_dispatch:
    inputs:
      force_retrain:
        description: "Reentrenar aunque la accuracy no esté por debajo del umbral"
        required: false
        default: false
        type: boolean

concurrency:
  group: pulso-transmi-supabase-writer
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PULSO_API_URL: ${{ secrets.PULSO_API_URL }}
          PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
        run: |
          missing=0
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY PULSO_API_URL PULSO_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub Secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Configure the missing secrets in repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Required secrets are configured."

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install '.[dev,ml]'

      - name: Run tests
        run: python -m pytest -q

      - name: Extract and update source data
        env:
          PULSO_API_URL: ${{ secrets.PULSO_API_URL }}
          PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_SHA: ${{ github.sha }}
        run: python -u -m src.ingest

      - name: Retrain if accuracy is low and publish predictions
        env:
          PULSO_API_URL: ${{ secrets.PULSO_API_URL }}
          PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_SHA: ${{ github.sha }}
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_USERNAME: ${{ secrets.MLFLOW_USERNAME }}
          MLFLOW_PASSWORD: ${{ secrets.MLFLOW_PASSWORD }}
          DAGSHUB_REPO_OWNER: ${{ vars.DAGSHUB_REPO_OWNER }}
          DAGSHUB_REPO_NAME: ${{ vars.DAGSHUB_REPO_NAME }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          MLFLOW_EXPERIMENT_NAME: ${{ vars.MLFLOW_EXPERIMENT_NAME || 'pulso-transmi' }}
          MLFLOW_REGISTERED_MODEL_NAME: ${{ vars.MLFLOW_REGISTERED_MODEL_NAME || 'pulso-transmi-demand' }}
          MLFLOW_ENVIRONMENT: production
          RETRAIN_ACCURACY_THRESHOLD: ${{ vars.RETRAIN_ACCURACY_THRESHOLD || '79' }}
          RETRAIN_INTERVAL_HOURS: ${{ vars.RETRAIN_INTERVAL_HOURS || '1' }}
        run: python -u -m src.pipeline ${{ inputs.force_retrain == true && '--force-retrain' || '' }}

      - name: Upload pending payloads on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-diagnostics-${{ github.run_id }}
          path: |
            artifacts/outbox/
            artifacts/pipeline-status.json
            artifacts/baseline/predictions.csv
          if-no-files-found: ignore
